# Both containers read .env from this directory automatically.
#
#   docker compose up -d --build collector    # start the live feed
#   docker compose logs -f collector
#   docker compose up -d --build ui           # http://localhost:8080
#   docker compose down
#
# The collector runs here rather than inside Postgres, and module 02 explains
# why: ClickHouse Managed Postgres has no HTTP extension, and its plperlu Perl
# has no TLS stack, so the database cannot fetch an https:// URL itself.

services:
  collector:
    build: ./collector
    container_name: citibike-collector
    environment:
      PGHOST:     ${PGHOST:?set PGHOST in .env}
      PGPORT:     ${PGPORT:-5432}
      PGUSER:     ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGSSLMODE:  ${PGSSLMODE:-require}
      GBFS_URL:      ${GBFS_URL:-https://gbfs.citibikenyc.com/gbfs/2.3/gbfs.json}
      GBFS_LANG:     ${GBFS_LANG:-en}
      POLL_SECONDS:  ${POLL_SECONDS:-60}
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: citibike-ui
    ports: ["${UI_PORT:-8080}:8080"]
    environment:
      PGHOST:     ${PGHOST:?set PGHOST in .env}
      PGPORT:     ${PGPORT:-5432}
      PGUSER:     ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGSSLMODE:  ${PGSSLMODE:-require}

      # Geometry lives here and never moves.
      LOCAL_SCHEMA: ${LOCAL_SCHEMA:-citibike}

      # Where sql/40-fdw-clickhouse.sql imported the foreign tables. Empty
      # until module 05. Left empty the dashboard says plainly that there is
      # nothing to push down to, rather than reporting a failed pushdown.
      FOREIGN_SCHEMA: ${FOREIGN_SCHEMA:-}

      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-120000}
    restart: unless-stopped
