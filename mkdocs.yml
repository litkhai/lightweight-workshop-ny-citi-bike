# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: NY Citi Bike — PostGIS meets ClickHouse
site_description: >-
  A self-service workshop on a live public data feed: keep the geography in
  Managed Postgres, push the counting down to ClickHouse Cloud, and prove from
  the execution plan which engine answered.
site_url: https://litkhai.github.io/lightweight-workshop-ny-citi-bike/
repo_url: https://github.com/litkhai/lightweight-workshop-ny-citi-bike
repo_name: litkhai/lightweight-workshop-ny-citi-bike
edit_uri: edit/main/workshop/

docs_dir: workshop
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  icon:
    logo: material/bike
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Workshop:
      - Overview: workshop-overview.md
      - Data model: data-model.md
      - "00 · Prerequisites": 00-prerequisites.md
      - "01 · Provision the services": 01-provision.md
      - "02 · Postgres and PostGIS": 02-postgres-and-feed.md
      - "03 · The feed": 03-the-feed.md
      - "04 · The half that cannot move": 04-spatial.md
      - "05 · Replicate to ClickHouse": 05-clickpipes.md
      - "06 · Push the counting down": 06-pushdown.md
      - "07 · The dashboard": 07-dashboard.md
      - "08 · Wrap-up and teardown": 08-wrap-up.md
      - "09 · Trips, generated · optional": 09-trips.md
  - Operations:
      - Instructor Guide: instructor-guide.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/clickhouse-v2.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/litkhai/lightweight-workshop-ny-citi-bike
      name: Workshop repository on GitHub

copyright: >-
  Independent educational workshop. ClickHouse is a registered trademark of
  ClickHouse, Inc. This site is not an official ClickHouse website and does not
  imply endorsement. Citi Bike system data is published by Lyft Bikes and
  Scooters, LLC under the GBFS specification.
